l_english:
 riseandfall_start_coalition_interaction:0 "Start Coalition"
 riseandfall_start_coalition_interaction_desc:0 "Call independent rulers to contain [recipient.GetShortUINamePossessive] aggressive realm. You will join the Coalition automatically; at least one other ruler must commit before it can declare war. All conditions below must be met."
 riseandfall_coalition.target_must_be_larger.tooltip:0 "The target realm must be larger than your realm."
 riseandfall_coalition.target_in_diplomatic_range.tooltip:0 "The target must be within diplomatic range."
 riseandfall_coalition.actor_not_at_war.tooltip:0 "You cannot start a Coalition while you are already at war."
 riseandfall_coalition.actor_not_allied.tooltip:0 "You cannot start a Coalition against an ally."
 riseandfall_coalition.actor_no_truce.tooltip:0 "You cannot start a Coalition while you have a truce with the target."
 riseandfall_coalition.target_independent.tooltip:0 "The target must be an independent ruler."
 riseandfall_coalition.target_threat.tooltip:0 "The target must control at least 5% of world territory, have at least 25% of its counties outside its primary title's exact de jure core, have reached 100 Coalition Threat, and be at least twice the size of your realm. Threat rises from rapid conquest, foreign de jure territory, global scale, and dominance over neighboring rulers; peaceful years reduce it."
 riseandfall_coalition.target_no_active_war.tooltip:0 "The target is already defending against a Coalition war."
 riseandfall_coalition.target_not_forming.tooltip:0 "The target is already gathering a Coalition."
 riseandfall_coalition.target_no_beta_cooldown.tooltip:0 "A Coalition recently failed against this primary title. It cannot be targeted by another Independent Coalition for ten years."
 riseandfall_coalition.target_no_postwar_cooldown.tooltip:0 "This primary title is protected by a postwar Coalition settlement and cannot face another Coalition until that settlement expires."
 riseandfall_coalition_ai_war_caution_low:0 "Coalition Caution"
 riseandfall_coalition_ai_war_caution_low_desc:0 "Rising Coalition Threat is making this ruler slightly less willing to begin another offensive war."
 riseandfall_coalition_ai_war_caution_medium:0 "Growing Coalition Caution"
 riseandfall_coalition_ai_war_caution_medium_desc:0 "Coalition Threat is making this ruler less willing to begin another offensive war."
 riseandfall_coalition_ai_war_caution_high:0 "Severe Coalition Caution"
 riseandfall_coalition_ai_war_caution_high_desc:0 "High Coalition Threat is strongly discouraging this ruler from beginning another offensive war."
 riseandfall_coalition_ai_war_caution_severe:0 "Containment Imminent"
 riseandfall_coalition_ai_war_caution_severe_desc:0 "A Coalition is imminent, making this ruler extremely reluctant to begin another offensive war."

 coalition.1001.t:0 "A Coalition Gathers"
 coalition.1001.d:0 "Our realm controls #V [ROOT.Char.MakeScope.Var('rf_coalition_peripheral_counties').GetValue|0]#! peripheral counties out of #V [ROOT.Char.MakeScope.Var('rf_coalition_total_counties').GetValue|0]#!: #V [ROOT.Char.MakeScope.Var('rf_coalition_peripheral_pct').GetValue|0]%#! lie outside the de jure realm of [ROOT.Char.GetPrimaryTitle.GetName]. Our weakness and overextension have given interested neighboring courts cause to act."
 coalition.1001.a:0 "The Coalition gathers at once."

 coalition.1002.t:0 "Invitation to a Coalition"
 coalition.1002.d:0 "The sprawling realm of [coalition_target.GetTitledFirstName] is unstable and overextended beyond the de jure realm of [coalition_target.GetHerHis] primary title. Interested neighboring rulers are joining to force every peripheral county from the realm. If enough rulers commit, the strongest among us will lead the attack."
 coalition.1002.a:0 "Join the coalition."
 coalition.1002.a.tt:0 "You pledge to join the Coalition war if a legal and sufficiently powerful coalition is assembled."
 coalition.1002.b:0 "This is not our war."
 coalition.1002.c.war:0 "We are already committed to another war."
 coalition.1002.c.alliance:0 "We will not betray our alliance."
 coalition.1002.c.truce:0 "Our truce forbids this attack."
 coalition.1002.c.invalid:0 "Circumstances prevent our participation."

 coalition.1003.t:0 "A Chance for Independence"
 coalition.1003.d:0 "A foreign Coalition is gathering against my liege, [coalition_target.GetTitledFirstName]. Because my realm holds land outside [coalition_target.GetHerHis] de jure core, its envoys promise independence if I rise beside them and the Coalition wins. My full military power will count for the attackers."
 coalition.1003.a:0 "I will rise against my liege."
 coalition.1003.a.tt:0 "You remain a vassal while joining the Coalition war against your liege. If the Coalition wins, you become independent; if it loses, you may be imprisoned and your liege may revoke one title without tyranny. The war may end in white peace."
 coalition.1003.b:0 "I will remain loyal."
 coalition.1003.c.war:0 "I cannot begin another war."
 coalition.1003.c.alliance:0 "I will not betray my allied liege."
 coalition.1003.c.invalid:0 "Circumstances prevent this rebellion."

 coalition.failure.a:0 "The danger has passed—for now."
 coalition.failure.a.tt:0 "The failed Coalition is disbanded and all temporary invitation state is cleared. If another low-stability incident is currently valid, it will be selected immediately; otherwise no cooldown is applied."
 coalition.1108.t:0 "The Coalition Fails to Form"
 coalition.1108.d:0 "Too few rulers were willing or able to oppose [ROOT.Char.GetTitledFirstNamePossessive] realm. The Coalition has dispersed; no new independent Coalition may be started against this primary title for ten years."
 coalition.1108.a:0 "The moment has passed."
 coalition.1109.t:0 "The Coalition Is Ready"
 coalition.1109.d:0 "Every invited ruler has answered. The Coalition's committed strength is #V [coalition_target.MakeScope.Var('rf_coalition_leader_power').GetValue|0]#!, against #V [coalition_target.MakeScope.Var('rf_coalition_target_power').GetValue|0]#! for [coalition_target.GetTitledFirstNamePossessive] side, including allies. #V [coalition_target.MakeScope.Var('rf_coalition_participant_count').GetValue|0]#! rulers have committed to the attack.\n\nWill you declare war?"
 coalition.1109.a:0 "Declare the Coalition War"
 coalition.1109.b:0 "Stand down"
 coalition.1101.t:0 "The Coalition Fails to Gain Traction"
 coalition.1101.d:0 "Foreign courts discussed intervention, but too few remained willing and legally able to fight. Only #V [ROOT.Char.MakeScope.Var('rf_coalition_participant_count').GetValue|0]#! valid attackers remained; a Coalition requires at least two. Another low-stability crisis will now be selected."
 coalition.1102.t:0 "The Coalition Is Outmatched"
 coalition.1102.d:0 "The strongest willing ruler could not match our alliance network. The prospective leader, allies, and rebellious vassals had #V [ROOT.Char.MakeScope.Var('rf_coalition_leader_power').GetValue|0]#! military power against our side's #V [ROOT.Char.MakeScope.Var('rf_coalition_target_power').GetValue|0]#!. Each willing vassal added their full power to the attackers. The Coalition has dispersed, and another low-stability crisis will now be selected."
 coalition.1103.t:0 "The Coalition Has No Leader"
 coalition.1103.d:0 "No willing ruler remained eligible to lead the Coalition. Death, war, lost independence, alliances, or truces may have invalidated the prospective attackers before assembly finished. Another low-stability crisis will now be selected."
 coalition.1104.t:0 "The Coalition Stands Down"
 coalition.1104.d:0 "A Coalition war against us already exists, so the assembled rulers will not begin a duplicate conflict. No additional low-stability crisis should be selected."
 coalition.1105.t:0 "The Coalition Declaration Fails"
 coalition.1105.d:0 "The Coalition passed its membership and military-power checks, but the scripted Coalition war could not be created or found on its selected leader. Another low-stability crisis will now be selected."
 coalition.1106.t:0 "The Coalition Loses Its Cause"
 coalition.1106.d:0 "Before the Coalition could act, this realm stopped satisfying its target requirements. The ruler may no longer be independent, landed, exceptionally large, or otherwise eligible. Another valid low-stability crisis will now be selected if possible."
 coalition.1107.t:0 "The Coalition Assembly Breaks Down"
 coalition.1107.d:0 "The Coalition reached its final declaration gate but failed an unclassified condition. Another low-stability crisis will now be selected."

 RISEANDFALL_COALITION_POWER_FAILED_TT:0 "The Coalition leader, allies, and rebellious vassals are weaker than the target's alliance network, so the war will not be declared."
 RISEANDFALL_COALITION_FALLBACK_TT:0 "The Coalition dissolved before war. Another valid low-stability incident will be selected instead."

 coalition.1201.t:0 "The Coalition's Verdict"
 coalition.1201.d:0 "The Coalition has defeated [coalition_vote_target.GetTitledFirstName]. Every attacker casts one vote in a random order before the punishment is imposed.\n\nLight: #V [coalition_vote_target.MakeScope.Var('rf_coalition_vote_light').GetValue|0]#!\nMedium: #V [coalition_vote_target.MakeScope.Var('rf_coalition_vote_medium').GetValue|0]#!\nHeavy: #V [coalition_vote_target.MakeScope.Var('rf_coalition_vote_heavy').GetValue|0]#!"
 coalition.1201.a:0 "Light punishment: demand an indemnity"
 coalition.1201.a.tt:0 "[coalition_vote_target.GetShortUIName] pays three years of income, divided equally among every Coalition member. This may force [coalition_vote_target.GetHerHim] into debt."
 coalition.1201.b:0 "Medium punishment: demand peripheral concessions"
 coalition.1201.b.tt:0 "[coalition_vote_target.GetShortUIName] pays the Coalition indemnity. The largest peripheral de jure kingdoms are released until at least half of the original peripheral counties are gone; participating rebel vassals become independent."
 coalition.1201.c:0 "Heavy punishment: force abdication and breakup"
 coalition.1201.c.tt:0 "[coalition_vote_target.GetShortUIName] pays the Coalition indemnity, abdicates to the original primary-title successor, and every peripheral county is released. The original primary crown and exact de jure core survive."

 coalition.1202.t:0 "The Leader Must Decide"
 coalition.1202.d:0 "The Coalition's vote against [coalition_vote_target.GetTitledFirstName] is tied. As Coalition leader, you must select one of the tied punishments.\n\nLight: #V [coalition_vote_target.MakeScope.Var('rf_coalition_vote_light').GetValue|0]#!\nMedium: #V [coalition_vote_target.MakeScope.Var('rf_coalition_vote_medium').GetValue|0]#!\nHeavy: #V [coalition_vote_target.MakeScope.Var('rf_coalition_vote_heavy').GetValue|0]#!"
 coalition.1202.a:0 "Choose the indemnity"
 coalition.1202.b:0 "Choose peripheral concessions"
 coalition.1202.c:0 "Choose abdication and full breakup"

 coalition.1203.t:0 "The Coalition Has Rendered Its Verdict"
 coalition.1203.d:0 "The Coalition led by [ROOT.Char.MakeScope.Var('rf_coalition_vote_result_leader').GetCharacter.GetTitledFirstName] has voted on the fate of [ROOT.Char.MakeScope.Var('rf_coalition_vote_result_target').GetCharacter.GetTitledFirstName].\n\nLight: #V [ROOT.Char.MakeScope.Var('rf_coalition_vote_result_light').GetValue|0]#!\nMedium: #V [ROOT.Char.MakeScope.Var('rf_coalition_vote_result_medium').GetValue|0]#!\nHeavy: #V [ROOT.Char.MakeScope.Var('rf_coalition_vote_result_heavy').GetValue|0]#!\n\nThe selected punishment is: [ROOT.Char.Custom('RFGetCoalitionVoteResult')]."
 coalition.1203.a:0 "The Coalition's will is done."
 rf_coalition_vote_result_light:0 "Light Punishment — Coalition Indemnity"
 rf_coalition_vote_result_medium:0 "Medium Punishment — Indemnity and Peripheral Concessions"
 rf_coalition_vote_result_heavy:0 "Heavy Punishment — Indemnity, Abdication, and Full Peripheral Breakup"
