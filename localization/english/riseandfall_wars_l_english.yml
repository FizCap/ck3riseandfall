l_english:
 riseandfall_ducal_conquest_cb: "Warlord Ducal Conquest"
 RISEANDFALL_DUCAL_CONQUEST_CB_NAME: "[ducal_conquest|E] of [county|E]"
 RISEANDFALL_DUCAL_CONQUEST_CB_SPECIFIC_NAME: "Warlord Ducal Conquest of [TITLE.GetBaseName]"
 WARLORD_CONQUEST_WAR_NAME: "Warlord Conquest of [TITLE.GetBaseNameNoTooltip]"
 WARLORD_CONQUEST_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 WARLORD_CONQUEST_CB_NAME: "Warlord Conquest"
 RISEANDFALL_WARLORD_CONQUEST_ON_VICTORY_DESC: "The war has concluded in your favor. You seize the selected de jure kingdom. Defeated administrative and celestial rulers surrender every title they hold but retain claims on them; other governments retain their remaining realm as your vassals where rank permits."
 RISEANDFALL_WARLORD_CONQUEST_ON_WHITE_PEACE_DESC: "The war ended in white peace. No land or vassals change hands."
 RISEANDFALL_WARLORD_CONQUEST_ON_DEFEAT_DESC: "The war has concluded against you. No territory changes hands."
 RISEANDFALL_DIADOCHI_CB_NAME: "Successor State War"
 RISEANDFALL_DIADOCHI_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetAdjective] Successor State War"
 RISEANDFALL_DIADOCHI_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 RISEANDFALL_DIADOCHI_ON_VICTORY_DESC: "The war has concluded in your favor. You seize the selected neighboring de jure kingdom. Vassal transfers use the normal complete-subrealm rules; occupation percentage does not decide the result."
 RISEANDFALL_DIADOCHI_ABSORPTION_ON_VICTORY_DESC: "The war has concluded in your favor. As the larger successor state, you subjugate the defeated ruler and absorb their realm."
 RISEANDFALL_WARLORD_ABSORPTION_ON_VICTORY_DESC: "The war has concluded in your favor. As the larger Warlord realm, you subjugate the defeated ruler and absorb their realm."
 RISEANDFALL_DIADOCHI_ON_DEFEAT_DESC: "The war has concluded against you. No territory changes hands."
 RISEANDFALL_DIADOCHI_ON_WHITE_PEACE_DESC: "The war ended in white peace. No land or vassals change hands."
 RISEANDFALL_COALITION_CB_NAME: "Coalition War"
 RISEANDFALL_COALITION_WAR_NAME: "Coalition War against [DEFENDER.GetPrimaryTitle.GetName]"
 RISEANDFALL_COALITION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]Coalition"
 RISEANDFALL_COALITION_ON_VICTORY_DESC: "Every Coalition attacker votes on the verdict. Light demands an indemnity; Medium releases at least half of the peripheral realm; Heavy forces abdication and releases every peripheral county while preserving the original crown and exact de jure core."
 RISEANDFALL_COALITION_ON_WHITE_PEACE_DESC: "The Coalition disperses without dismantling the defender's realm."
 RISEANDFALL_COALITION_ON_DEFEAT_DESC: "The Coalition has failed, leaving the defender's titles intact. Participating rebel vassals may be imprisoned, and the defender may revoke one title from each without tyranny."
 RISEANDFALL_COALITION_ON_INVALIDATED_DESC: "The Coalition War can no longer continue."
 riseandfall_coalition_second_revoke_reason: "Rebelled in a Coalition War"
