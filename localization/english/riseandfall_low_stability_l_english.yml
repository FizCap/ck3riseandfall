RISEANDFALL_RUMP_REALM_NAME:0 "[root.GetFirstNamePossessive] Rump Realm"
RISEANDFALL_BREAKAWAY_FACTION:0 "Breakaway Faction"
RISEANDFALL_REALM_SPLIT_TRUCE:0 "Realm Split Truce"

riseandfall_former_liege_opinion:0 "Former Liege"
riseandfall_former_liege_opinion_desc:0 "This ruler was once our liege before the great fracturing."

riseandfall_negotiated_peace_opinion:0 "Negotiated Settlement"
riseandfall_negotiated_peace_opinion_desc:0 "Our liege made concessions to keep the realm together."

riseandfall_split_defection_opinion:0 "Changed Sides"
riseandfall_split_defection_opinion_desc:0 "This ruler abandoned the former balance of power and crossed into a rival camp during the successor struggle."

realm_split.2001.t:0 "A Vassal Changes Sides"
realm_split.2001.d:0 "[scope:split_defector.GetTitledFirstName] has abandoned your cause and sworn fealty to [scope:split_new_liege.GetTitledFirstName]. The fracturing of the realm has become still more bitter, as even your own camp is no longer secure."
realm_split.2001.a:0 "Treachery."

riseandfall_switch_sides_interaction:0 "Defect/Switch Sides"
riseandfall_switch_sides_interaction_desc:0 "Offer to abandon your current camp and join [recipient.GetShortUINamePossessiveNoTooltip] side in the successor struggle."
riseandfall_switch_sides_interaction_notification:0 "[actor.GetShortUIName] seeks to defect from [actor.GetLiege.GetShortUIName] and join your side in the successor struggle."
riseandfall_switch_sides_no_truce_with_liege:0 "You do not have a [truce|E] with your [liege|E]"
riseandfall_switch_sides_not_at_war_with_liege:0 "You are not at [war|E] with your [liege|E]"

riseandfall_surrender_to_successor_interaction:0 "Surrender Realm"
riseandfall_surrender_to_successor_interaction_desc:0 "Offer to give up your successor crown and submit to [recipient.GetShortUINameNoTooltip] as a vassal."
riseandfall_surrender_to_successor_interaction_notification:0 "[actor.GetShortUIName] offers to yield [actor.GetHerHis] successor crown and submit to you."

 # Authority Collapse localization
authority_collapse.1001.t:0 "A Tide of Nationalist Unrest"
 authority_collapse.1001.d:0 "The diverse peoples of your realm grow restless. Whispers of foreign rule and religious oppression spread through the provinces — those who feel unrepresented are rising in defiance. The counties that do not share your culture or faith are seething with resentment, and their anger threatens to spill into open revolt."
 authority_collapse.1001.a:0 "Trial by fire — endure the storm"
 authority_collapse.1001.tooltip:0 "All non-approved culture and hostile-faith counties suffer a severe popular opinion collapse for 10 years. No development is harmed — the people resist foreign rule, not progress."
 authority_collapse.1001.b:0 "Release the rebellious peoples to self-rule"
 authority_collapse.1001.b.tooltip:0 "The discontented counties are ceded to new independent realms. Rulers matching each region's culture and faith are raised to lead them. You suffer a prestige loss and vassal opinion penalty for yielding territory, but the revolt is extinguished and you retain unpressed claims on every new realm."
 authority_collapse.1002.t:0 "Vassal Authority Crisis"
 authority_collapse.1002.d:0 "Your vassals have gathered behind a common demand. They will continue withholding their wealth and soldiers unless the crown recognizes greater noble autonomy. You may grant every privilege they seek, offer only a limited settlement, or refuse and risk making every lord in the realm your enemy."
 authority_collapse.1002.a:0 "Grant every concession"
 authority_collapse.1002.a.tooltip:0 "For 10 years, all vassal tax and levy contributions are reduced by 45%, while vassal opinion improves slightly. The immediate crisis is settled and its escalation marker is removed."
 authority_collapse.1002.b:0 "Offer a limited settlement"
 authority_collapse.1002.b.tooltip:0 "For 10 years, all vassal tax and levy contributions are reduced by 25%, while vassal opinion suffers a smaller penalty. The vassal crisis remains on the escalation track."
 authority_collapse.1002.c:0 "Refuse their demands"
 authority_collapse.1002.c.tooltip:0 "For 10 years, all vassal tax and levy contributions are reduced by 75%. Vassal opinion suffers a massive penalty, overall levies and domain taxes fall by 25%, and existing factions become more dangerous."
 authority_collapse.1003.t:0 "Total Collapse of Central Authority"
 authority_collapse.1003.d:0 "The very foundations of your realm tremble as central authority crumbles. Bandits roam freely across the lands, unchecked by any semblance of order. Roads are unsafe, taxes go uncollected, and the people suffer under the weight of anarchy. Armies desert en masse, corruption empties the treasury, and your vassals abandon their oaths and loyalty, leaving governance in ruins. The collapse is complete — your realm has descended into chaos."
 authority_collapse.1003.a:0 "Acknowledge the disaster"
 authority_collapse.1003.tooltip:0 "Bandits now run rampant across your entire realm. All provinces suffer declining county control, development, and popular opinion for 10 years. Armies may desert, corruption drains the treasury, and vassal loyalty collapses."

# Modifier localization
riseandfall_authority_collapse:0 "Authority Collapse"
riseandfall_authority_collapse_desc:0 "Local order has broken down: county control and development decline, popular opinion collapses, armies desert, taxes fail, and vassal loyalty collapses while this modifier is active."
riseandfall_nationalist_revolt:0 "Nationalist Revolt"
riseandfall_nationalist_revolt_desc:0 "Local sentiment has turned against foreign rule: popular opinion has collapsed as the populace rejects outside authority and demands self-determination."
riseandfall_authority_collapse_liege_debuff:0 "Authority Collapse"
riseandfall_authority_collapse_liege_debuff_desc:0 "Your personal authority has crumbled: levies and vassal contributions are halved, armies may partially desert, taxes falter as corruption empties the treasury, and mercenaries become prohibitively expensive for the duration of the collapse."
riseandfall_vassal_crisis_full_concessions:0 "Noble Privileges Granted"
riseandfall_vassal_crisis_full_concessions_desc:0 "The crown has granted the nobility's full settlement: vassal tax and levy contributions are reduced, but the lords are temporarily satisfied."
riseandfall_vassal_crisis_limited_concessions:0 "Uneasy Noble Settlement"
riseandfall_vassal_crisis_limited_concessions_desc:0 "The crown offered only a limited settlement. Vassal tax and levy contributions are reduced while dissatisfaction remains in the realm."
riseandfall_vassal_crisis_refusal:0 "Noble Defiance"
riseandfall_vassal_crisis_refusal_desc:0 "The crown refused the nobility's demands. Vassal contributions and domain taxes have collapsed, levies are weaker, and hostile lords are emboldened."
## (removed) riseandfall_revolt_concession_debuff localization entries
