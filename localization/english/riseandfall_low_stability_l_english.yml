l_english:
 puppet.1001.t:0 "The Empire is Collapsing"
 puppet.1001.d:0 "Central authority is starting to collapse. A powerful vassal has decided to restore order and has made my capital his home."
 puppet.1001.a:0 "Acknowledge"
 puppet.1002.t:0 "Offer to Become Puppet Master"
 puppet.1002.d:0 "The emperor's realm is in chaos due to low stability. As a powerful vassal, you have the opportunity to seize control and become the puppet master, ruling through a regency diarchy. Will you accept this chance to stabilize the empire under your guidance?"
 puppet.1002.a:0 "Accept and become Puppet Master"
 puppet.1002.b:0 "Decline and let another vassal try"


 # Warlord localization
warlord_loyalty_opinion:0 "Loyal Vassal."


 # Low stability event localization
warlord.1001.t:0 "Warlords Rising"
warlord.1001.d:0 "Whispers of rebellion poison the halls of power. Every direct landed vassal must now raise either a Rebel or Loyal Warlord banner, and newly arrived vassals will be forced to choose each year while the era continues. Even a Loyal majority cannot end the Warlord Era until ten years have passed."
warlord.1001.a:0 "Summon the council — confront the threat"
warlord.1001.picture:0 "gfx/interface/portraits/medium/portrait_generic_m.tga"
warlord.1001.background:0 "gfx/interface/event_pictures/backgrounds/bg_realm_unrest.tga"

warlord.1002.t:0 "Banner or Fealty?"
warlord.1002.d:0 "Order frays and rival banners rise across the realm. Will you become a Rebel Warlord and seize power for yourself, or become a Loyal Warlord and defend the Crown's remaining authority?"
warlord.1002.a:0 "Raise the red standard — become a Rebel Warlord"
warlord.1002.b:0 "Defend the Crown — become a Loyal Warlord"

warlord.1003.t:0 "The Path of the Warlord"
warlord.1003.d:0 "You have embraced the mantle of Warlord. Your strength now depends on how much of the realm follows its own banners — will you remain a regional challenger, or lay down your ambitions?"
warlord.1003.a:0 "Continue the path — rally the Warlords"
warlord.1003.b:0 "Abandon the path — renounce your warlord ambitions"

warlord.1010.t:0 "Order Restored"
warlord.1010.d:0 "The last warlord banners have been lowered. Through arrests, submission, and the recovery of royal authority, the age of private armies and rival lords has ended. The realm is united beneath the crown once more."
warlord.1010.a:0 "The Warlord Era is over."

warlord.1011.t:0 "The Loyal Banners Prevail"
warlord.1011.d:0 "After a decade of rival banners, your personal domain and the lands held by Loyal Warlords now command a majority of the realm. Rebel standards are lowered as the Crown's coalition restores a stable order. The Warlord Era is over."
warlord.1011.a:0 "The realm stands with the Crown."

warlord.1012.t:0 "The Loyal Banners Prevail"
warlord.1012.d:0 "[ROOT.Char.GetLiege.GetTitledFirstNamePossessive] personal domain and the Loyal Warlord bloc now control a majority of the realm. The competing banners are lowered and the Warlord Era comes to an end."
warlord.1012.a:0 "The Crown has won the struggle."

riseandfall_warlord_path_manager:0 "Warlord Path Manager"
riseandfall_warlord_path_manager_desc:0 "Choose whether to stand as a Rebel Warlord or a Loyal Warlord during the active era."
riseandfall_warlord_path_manager_tooltip:0 "Change allegiance once per year while the Warlord Era remains active. A Loyal majority cannot end the era during its first ten years."
riseandfall_warlord_path_manager_tooltip_tt:0 "Rebel Warlords seek power for themselves; Loyal Warlords defend the Crown and cannot invade one another."
riseandfall_warlord_path_manager_confirm:0 "Toggle Warlord Path"
riseandfall_choose_warlord_loyal_confirm:0 "Join the Loyal Bloc"
riseandfall_choose_warlord_rebel_confirm:0 "Join the Rebellion"
riseandfall_warlord_choice_currently_rebellious:0 "You are currently a Rebel Warlord."
riseandfall_warlord_choice_currently_loyal:0 "You are currently a Loyal Warlord."
riseandfall_choose_warlord_loyal:0 "Become a Loyal Warlord"
riseandfall_choose_warlord_loyal_desc:0 "Pledge your armies to the Crown. The liege's domain and Loyal Warlord lands count toward the 51% loyal victory threshold."
riseandfall_choose_warlord_loyal_tooltip:0 "Join the Loyal Warlord bloc. You cannot use Warlord invasions against other Loyal Warlords."
riseandfall_choose_warlord_rebel:0 "Become a Rebel Warlord"
riseandfall_choose_warlord_rebel_desc:0 "Abandon the Crown's coalition and join the Rebel Warlords competing for the realm."
riseandfall_choose_warlord_rebel_tooltip:0 "Join the Rebel Warlord bloc while the current Warlord Era lasts."
riseandfall_warlord_create_realm_titles:0 "Forge Warlord Titles"
riseandfall_warlord_create_realm_titles_desc:0 "Create every unclaimed de jure duchy, kingdom, and empire where you or your vassals hold land, bypassing court formalities that were never meant to restrain a warlord."
riseandfall_warlord_create_realm_titles_tooltip:0 "Create all available warlord titles in your realm."
riseandfall_warlord_create_realm_titles_confirm:0 "Forge Titles"

 # Adventurer localization
adventurer.1001.t:0 "Horde of Adventurers"
adventurer.1001.d:0 "The realm's instability has attracted a swarm of landless adventurers, each with claims to your throne. They gather in the shadows, ready to invade and challenge your rule."
adventurer.1001.a:0 "Oh dear"

 # Trait localization
trait_warlord:0 "Rebel Warlord"
trait_warlord_desc:0 "A bold and ruthless commander who raises a red standard against the Crown and carves power from chaos."
trait_loyalwarlord:0 "Loyal Warlord"
trait_loyalwarlord_desc:0 "A formidable regional commander whose green banner and armies uphold the Crown during the Warlord Era."

 # Opinion localization
warlord_rebellion_opinion:0 "Rebellious Warlord"
warlord_rebellion_opinion_desc:0 "This vassal has raised the banner of rebellion as a warlord, threatening the stability of the realm."
warlord_abandonment_opinion:0 "Abandoned Warlord Ambitions"
warlord_abandonment_opinion_desc:0 "This former warlord has renounced their rebellious ambitions and returned to the fold."

trait_retiredwarlord:0 "Retired Warlord"
trait_retiredwarlord_desc:0 "Once a stirring force who sowed chaos across the realm, they have laid down their sword — their days of conquest are done."

 # Palace Coup localization

 # Titles & descriptions
palace_coup.1001.t:0 "Palace Coup Attempt"
palace_coup.1001.desc:0 "A faction within your court has seized the palace and now moves openly against you. This is no longer a matter of whispers and hidden daggers. Someone inside your own household means to rule through you, or in your place."

palace_coup.1002.t:0 "The Ultimatum"
palace_coup.1002.d:0 "[challenger.GetTitledFirstName] stands before you with the palace already in conspiratorial hands. There will be no duel and no final bargain. Submit, and you may remain on the throne as a puppet. Slip away now, and the realm may fracture into rival successor states under the old banners of civil war."

palace_coup.1003.t:0 "You Slip Away Into Rebellion"
palace_coup.1003.d:0 "You stagger from the palace with enough loyalists to keep the struggle alive. [challenger.GetTitledFirstName] now clings to the old capital and the ancient title, while the outer realm fractures around the old order. Rival successor states rise from the chaos, and civil war has begun in earnest."

palace_coup.1004.t:0 "A Puppet Throne"
palace_coup.1004.d:0 "You yield before the conspirators. [challenger.GetTitledFirstName] now rules through you as puppet master. Your crown remains upon your brow, but authority has passed into other hands."

palace_coup.1005.t:0 "Failed Escape — You Are Puppeted"
palace_coup.1005.d:0 "Your attempt to flee was thwarted. [challenger.GetTitledFirstName] caught you and has placed you under a puppet regency. You remain the figurehead ruler, but the puppet master will pull the strings."
palace_coup.1005.a:0 "Accept your fate"
palace_coup.1005.tooltip:0 "You failed to flee — you will remain in name only, while [challenger.GetTitledFirstName] governs behind the curtain."
 # Option text (labels)
palace_coup.1001.a:0 "Hear the ultimatum"
palace_coup.1001.b:0 "Flee the palace"
palace_coup.1002.a:0 "Surrender and accept a puppet regency"
palace_coup.1002.b:0 "Retreat and raise a rebellion"
palace_coup.1003.a:0 "Rally the loyalists"
palace_coup.1004.a:0 "Endure the humiliation"

# Child-specific option when ruler is a child
palace_coup.1002.c:0 "I yield the throne."
palace_coup.1002.child_tooltip:0 "The ruler is a child — you are forced to yield the throne to [challenger.GetTitledFirstName]."

 # UI tooltips used by options/duel outcomes
palace_coup.1001.tooltip:0 "Decide whether to submit to the coup or escape and gather loyalists."
palace_coup.1002.surrender.tooltip:0 "You submit to the coup and continue to reign only in name."
palace_coup.1002.rebellion.tooltip:0 "You escape the palace, cede the capital to the challenger, and trigger the full realm-split civil war."
palace_coup.1002.win.tooltip:0 "You win the duel and kill the challenger."
palace_coup.1002.lose.tooltip:0 "You will be spared but reduced to a puppet under [challenger.GetTitledFirstName]."
palace_coup.1002.flee_success.tooltip:0 "You successfully flee, and the realm fractures into rival successor states."
palace_coup.1002.fail.tooltip:0 "You get caught and assassinated."
palace_coup.1002.flee_tooltip:0 "Attempt to flee — an intrigue duel between you and [challenger.GetTitledFirstName]."
palace_coup.1003.tooltip:0 "The challenger keeps the old title and capital core while the wider realm fractures into successor states and civil war."
palace_coup.1004.tooltip:0 "You remain on the throne only as [challenger.GetTitledFirstName]'s puppet."

palace_coup.1101.t:0 "Palace Coup Confirmation"
palace_coup.1101.d:0 "You have been selected to lead the palace coup against [event_root.GetTitledFirstName]. Do you wish to proceed with this dangerous endeavor?"
palace_coup.1101.a:0 "Yes, I will seize the throne!"
palace_coup.1101.b:0 "No, I decline."
palace_coup.1101.tooltip:0 "Proceed with the palace coup."
palace_coup.1101.tooltip_no:0 "Decline the palace coup; another challenger will be found."

palace_coup.1201.t:0 "The Realm Demands Your Banner"
palace_coup.1201.d:0 "[palace_coup_choice_ruler.GetTitledFirstName] has fled the palace, while [palace_coup_choice_challenger.GetTitledFirstName] claims the old center of power. Other direct-vassal claimants have also raised their banners. Decide which side your realm will support."
palace_coup.1201.a:0 "Stand with [palace_coup_choice_ruler.GetFirstNameNoTooltip]"
palace_coup.1201.a.tooltip:0 "You remain in the deposed ruler's camp. Lower-tier realms rejoin [palace_coup_choice_ruler.GetHerHis] restored state; under a hegemony, empire-tier loyalists instead become allied successor states."
palace_coup.1201.b:0 "Join [palace_coup_choice_challenger.GetFirstNameNoTooltip]"
palace_coup.1201.b.tooltip:0 "You accept the palace coup and remain inside the challenger's core successor realm."
palace_coup.1201.c:0 "Choose a Side"
palace_coup.1201.c.tooltip:0 "Review the deposed ruler, coup leader, and every landed direct-vassal claimant in one paginated list, then pledge your realm to one side."

palace_coup.1202.t:0 "Choose a Side"
palace_coup.1202.d:0 "The deposed ruler and coup leader are shown alongside every landed direct vassal with a claim on the former primary title. Select the side your realm will support. Claimants are paginated from weakest to strongest military power."
palace_coup.1202.a_1:0 "Support [palace_coup_claimant_target_1.GetShortUINameNoTooltip]"
palace_coup.1202.a_2:0 "Support [palace_coup_claimant_target_2.GetShortUINameNoTooltip]"
palace_coup.1202.a_3:0 "Support [palace_coup_claimant_target_3.GetShortUINameNoTooltip]"
palace_coup.1202.a_4:0 "Support [palace_coup_claimant_target_4.GetShortUINameNoTooltip]"
palace_coup.1202.a_5:0 "Support [palace_coup_claimant_target_5.GetShortUINameNoTooltip]"
palace_coup.1202.a_6:0 "Support [palace_coup_claimant_target_6.GetShortUINameNoTooltip]"
palace_coup.1202.a_7:0 "Support [palace_coup_claimant_target_7.GetShortUINameNoTooltip]"
palace_coup.1202.previous:0 "Previous Claimants"
palace_coup.1202.next:0 "More Claimants"
palace_coup.1202.back:0 "Return"

palace_coup.1203.t:0 "Pledge Your Banner"
palace_coup.1203.d:0 "You will support [palace_coup_selected_claimant.GetTitledFirstName] in the coming succession struggle. Support for a third claimant creates a claimant-led successor state; support for either established ruler keeps your realm in that ruler's camp."
palace_coup.1203.a:0 "Pledge to [palace_coup_selected_claimant.GetFirstNameNoTooltip]"
palace_coup.1203.b:0 "Choose Another Side"

palace_coup.1204.t:0 "Declare Your Claim"
palace_coup.1204.d:0 "The palace coup has shattered the old order. As a landed claimant to [original_primary.GetName], you must declare whether to support the deposed ruler, accept the coup, or press your own claim. Only declared bids will be offered to the realm in the coming struggle."
palace_coup.1204.a:0 "Stand with [palace_coup_choice_ruler.GetFirstNameNoTooltip]"
palace_coup.1204.b:0 "Join [palace_coup_choice_challenger.GetFirstNameNoTooltip]"
palace_coup.1204.c:0 "Stake My Own Claim"

# Challenger notification events
palace_coup.2001.t:0 "Defeat in the Duel"
palace_coup.2001.d:0 "The duel has ended in disaster. [event_root.GetTitledFirstName] proved victorious, and your challenge has failed. Your life ends here in the palace corridors."
palace_coup.2001.a:0 "Accept your fate"
palace_coup.2001.tooltip:0 "You lost the duel and will perish."

palace_coup.2002.t:0 "The Throne Submits"
palace_coup.2002.d:0 "[event_root.GetTitledFirstName] yields without a fight. You now govern as puppet master, guiding the realm from behind the throne while the crown remains on another's head."
palace_coup.2002.a:0 "Power behind the curtain"
palace_coup.2002.tooltip:0 "The ruler has yielded, leaving you to govern through a puppet regency."

palace_coup.2003.t:0 "The Coup Becomes Rebellion"
palace_coup.2003.d:0 "[event_root.GetTitledFirstName] escaped the palace before your grip fully closed. You hold the old title and the capital core, but much of the outer realm is splintering into rival successor states around the fleeing ruler. What began as court intrigue has become full civil war."
palace_coup.2003.a:0 "Crush them"
palace_coup.2003.tooltip:0 "You seized the throne, but the outer realm is now fracturing into successor states around the deposed ruler."

palace_coup.2004.t:0 "Escape Thwarted"
palace_coup.2004.d:0 "[event_root.GetTitledFirstName] attempted to flee but was caught! You have successfully thwarted [event_root.GetHerHis] escape and established yourself as puppet master, ruling through a regency diarchy."
palace_coup.2004.a:0 "Secure your victory"
palace_coup.2004.tooltip:0 "You caught the fleeing ruler and have become puppet master of the realm."

 # Misc / gameplay keys
palace_coup_adventurer_camp_name:0 "Palace Coup War Camp"
palace_coup_adventurer_camp_adj:0 "Palace Coup"
death_in_palace_coup:0 "Died in the palace coup"
