l_english:
 riseandfall_enable_auto_create_duchies:0 "Create Duchies"
 riseandfall_enable_auto_create_duchies_desc:0 "Create suitable duchy titles for your rulers manually. This action does not cost gold but does not award the usual prestige or legitimacy benefits — it is a cheat option; use at your own risk. You can enable or disable individual titles in the Title view menu."
 riseandfall_enable_auto_create_duchies_tooltip:0 "Create duchies now. Note: this does not cost gold and does not grant prestige or legitimacy. Use at your own risk. Use the Title view to toggle which titles are eligible."
 riseandfall_enable_auto_create_duchies_confirm:0 "Create Duchies"

 riseandfall_enable_auto_create_kingdoms:0 "Create Kingdoms"
 riseandfall_enable_auto_create_kingdoms_desc:0 "Create suitable kingdom titles for your rulers manually. This action does not cost gold but does not award the usual prestige or legitimacy benefits — it is a cheat option; use at your own risk. You can enable or disable individual titles in the Title view menu."
 riseandfall_enable_auto_create_kingdoms_tooltip:0 "Create kingdoms now. Note: this does not cost gold and does not grant prestige or legitimacy. Use at your own risk. Use the Title view to toggle which titles are eligible."
 riseandfall_enable_auto_create_kingdoms_confirm:0 "Create Kingdoms"

riseandfall_grant_duchies:0 "Grant Duchies"
riseandfall_grant_duchies_desc:0 "Grant eligible duchy titles to de jure vassals now. Available only to rulers above duchy rank, so recipients remain vassals. You can enable or disable individual titles in the Title view menu."
riseandfall_grant_duchies_tooltip:0 "Grant eligible duchies now. Requires a primary title above duchy rank. Use the Title view to toggle which titles are eligible."
riseandfall_grant_duchies_confirm:0 "Grant Duchies"

riseandfall_grant_kingdoms:0 "Grant Kingdoms"
riseandfall_grant_kingdoms_desc:0 "Grant eligible kingdom titles to de jure vassals now. Available only to rulers above kingdom rank, so recipients remain vassals. You can enable or disable individual titles in the Title view menu."
riseandfall_grant_kingdoms_tooltip:0 "Grant eligible kingdoms now. Requires a primary title above kingdom rank. Use the Title view to toggle which titles are eligible."
riseandfall_grant_kingdoms_confirm:0 "Grant Kingdoms"

riseandfall_grant_empires:0 "Grant Empires"
riseandfall_grant_empires_desc:0 "Grant eligible empire titles to qualified de jure vassals now. This decision is available only to hegemony-tier rulers, so granted empires remain vassal titles. You can enable or disable individual titles in the Title view menu."
riseandfall_grant_empires_tooltip:0 "Grant eligible empires now. Your capital empire is retained, and each recipient is chosen from qualified de jure vassals."
riseandfall_grant_empires_confirm:0 "Grant Empires"
 
riseandfall_grant_counties:0 "Grant Surplus Counties"
riseandfall_grant_counties_desc:0 "Create suitable vassals of your culture and faith and grant eligible surplus counties to them (excludes counties in the de jure kingdom containing your capital). Available only to duke-tier rulers or higher. You can enable or disable individual counties in the Title view menu."
riseandfall_grant_counties_confirm:0 "Grant Surplus Counties"

riseandfall_transfer_rightful_vassals:0 "Transfer Rightful Vassals"
riseandfall_transfer_rightful_vassals_desc:0 "Transfer eligible direct vassals to their de jure liege now. If the immediate de jure holder is not your direct vassal, the transfer falls back to that holder's direct liege when vanilla transfer rules allow it."
riseandfall_transfer_rightful_vassals_tooltip:0 "Transfer eligible direct vassals to their rightful liege now."
riseandfall_transfer_rightful_vassals_confirm:0 "Transfer Rightful Vassals"

riseandfall_automate_house_child_guardians:0 "Enable House Child Guardian Automation"
riseandfall_automate_house_child_guardians_desc:0 "Enable yearly automatic guardian assignment for unguarded children of your house in your court. The first pass runs immediately. Guardians are selected using the child's education focus, the vanilla focus-skill and Learning weights, intelligence traits, and a secondary preference for desirable personality traits."
riseandfall_automate_house_child_guardians_tooltip:0 "Enable automatic guardian assignment and run it now."
riseandfall_automate_house_child_guardians_confirm:0 "Enable Guardian Automation"
riseandfall_disable_automate_house_child_guardians:0 "Disable House Child Guardian Automation"
riseandfall_disable_automate_house_child_guardians_desc:0 "Stop the yearly automatic guardian assignment for children of your house. Existing guardian assignments are unchanged."
riseandfall_disable_automate_house_child_guardians_tooltip:0 "Disable automatic guardian assignment."
riseandfall_disable_automate_house_child_guardians_confirm:0 "Disable Guardian Automation"
decision_group_type_courtier_automation:0 "Rise and Fall Courtier Automation"
riseandfall_enable_auto_invite_knights:0 "Invite Free Knights"
riseandfall_enable_auto_invite_knights_desc:0 "Run a one-time search through your guests and foreign courts in diplomatic range. It recruits enough candidates who accept a vanilla invitation without travel expenses, Influence, or a Hook to fill every open knight slot and replace weaker serving knights."
riseandfall_enable_auto_invite_knights_tooltip:0 "Immediately recruit every needed free candidate who fills or improves your knight roster."
riseandfall_enable_auto_invite_knights_confirm:0 "Invite Free Knight"
riseandfall_disable_auto_invite_knights:0 "Recruit Paid Knights"
riseandfall_disable_auto_invite_knights_desc:0 "Run a one-time search for enough paid candidates to fill every open knight slot and replace every serving knight beaten by an affordable candidate. Candidates are processed by Prowess; each exact payment is shown and charged only when affordable."
riseandfall_disable_auto_invite_knights_tooltip:0 "Immediately recruit every needed affordable knight upgrade."
riseandfall_disable_auto_invite_knights_confirm:0 "Recruit Paid Knight"
riseandfall_invite_best_free_courtier:0 "Invite Best Free Courtier"
riseandfall_invite_best_free_courtier_desc:0 "Invite the single best adult candidate who will join your court without travel expenses, Influence, or a Hook. Candidates are ranked by their combined Diplomacy, Martial, Stewardship, Intrigue, and Learning."
riseandfall_invite_best_free_courtier_tooltip:0 "Immediately invite the free candidate with the highest combined council skills."
riseandfall_invite_best_free_courtier_confirm:0 "Invite Best Courtier"
riseandfall_recruit_best_paid_courtier:0 "Recruit Best Paid Courtier"
riseandfall_recruit_best_paid_courtier_desc:0 "Recruit the single best adult candidate who requires payment to join your court. Candidates are ranked by their combined Diplomacy, Martial, Stewardship, Intrigue, and Learning; the exact payment is shown and charged only when affordable."
riseandfall_recruit_best_paid_courtier_tooltip:0 "Immediately recruit the paid candidate with the highest combined council skills."
riseandfall_recruit_best_paid_courtier_confirm:0 "Recruit Best Courtier"
riseandfall_enable_auto_invite_guardians:0 "Invite Best Free Guardian"
riseandfall_enable_auto_invite_guardians_desc:0 "Run a one-time search for the best high-value guardian who accepts a vanilla invitation without travel expenses, Influence, or a Hook. Recruitment occurs only when an eligible house child lacks a guardian and no high-value ward slot remains in court."
riseandfall_enable_auto_invite_guardians_tooltip:0 "Immediately recruit the best needed free guardian."
riseandfall_enable_auto_invite_guardians_confirm:0 "Invite Free Guardian"
riseandfall_disable_auto_invite_guardians:0 "Recruit Best Paid Guardian"
riseandfall_disable_auto_invite_guardians_desc:0 "Run a one-time search for the best high-value paid guardian. Recruitment occurs only when additional high-value ward capacity is needed, and the displayed payment is charged only when affordable."
riseandfall_disable_auto_invite_guardians_tooltip:0 "Immediately recruit the best needed affordable guardian."
riseandfall_disable_auto_invite_guardians_confirm:0 "Recruit Paid Guardian"
riseandfall_grant_county_popup_title:0 "County granted"
riseandfall_grant_county_popup_desc:0 "You granted the county: \n[SCOPE.sTitle('target_county').GetNameNoTierNoTooltip]"

riseandfall_enable_hide_mod_decisions:0 "Hide Rise and Fall decisions"
riseandfall_enable_hide_mod_decisions_desc:0 "Hide all Rise and Fall mod decisions from the decisions panel until you toggle this off. Useful for decluttering the UI when you don't want to see the mod's decisions."
riseandfall_enable_hide_mod_decisions_tooltip:0 "Hide Rise and Fall decisions"
riseandfall_enable_hide_mod_decisions_confirm:0 "Hide Rise and Fall decisions"

riseandfall_disable_hide_mod_decisions:0 "Show Rise and Fall decisions"
riseandfall_disable_hide_mod_decisions_desc:0 "Show all Rise and Fall mod decisions in the decisions panel."
riseandfall_disable_hide_mod_decisions_tooltip:0 "Show Rise and Fall decisions"
riseandfall_disable_hide_mod_decisions_confirm:0 "Show Rise and Fall decisions"

riseandfall_hide_mod_decision_menu:0 "Hide/Show Rise and Fall decisions"
riseandfall_hide_mod_decision_menu_desc:0 "Open a small selection menu allowing you to hide or show all Rise and Fall decisions. Choose the option you want to perform."
riseandfall_hide_mod_decision_menu_tooltip:0 "Open Hide/Show Rise and Fall decisions menu."

riseandfall_hide_mod_decision_menu_tt:0 "Select a valid option"
riseandfall_hide_mod_decision_menu_tooltip_tt:0 "This will hide or show Rise and Fall decisions immediately when you confirm."

riseandfall_hide_mod_decision_menu_confirm:0 "Apply"
